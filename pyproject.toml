[project]
name = "jlens-causal-multihop"
version = "1.0.0"
description = "Corrected broad-band J-lens/R-lens causal multihop experiments on Qwen3.6-27B and Gemma 3 27B-it."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "jlens @ git+https://github.com/anthropics/jacobian-lens@581d398613e5602a5af361e1c34d3a92ea82ba8e",
  "torch>=2.11,<3",
  "transformers>=5.11.0,<6",
  "accelerate>=1.0",
  "huggingface-hub>=1.18.0",
  "numpy>=2.1",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/typo_readout"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
pythonpath = ["src"]
